# The oracles are binaries only. An image rebuild must match the whole package
# list and every named binary's digest, not just a tag. Packages come from the
# Ubuntu snapshot archive at one instant, so a rebuild resolves the same
# versions on any day.
[container]
base = "docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55"
snapshot = "20261101T000000Z"
packages_sha256 = "8eaab4f45f24f764fa32d47d571dccb60bb579da433341f1d1f439dd278f7622"
binary_manifest_sha256 = "c1bf425a70ac9439f374cfe8e62981aebccd5ce8d67d5289fd6b8f83a9d85f78"

