# Whole published release archives: wolf release 443798290 (v0.2.40) and lupin
# release 443651522 (v0.1.62), read twice from the release API on 2026-11-14,
# agreeing on asset ids and digests (tests/pin-read-1.json, -2.json).
#
# The std pin is wolf-std trunk c339a471, newer than the std the wolf 0.2.40
# archive bundles. Besides the pseudo-terminal and session surface
# (std.term.open_pty, std.process.start_session) it carries the one wait over
# files, sockets and signals (std.poll on the runtime's readiness sets), the
# one-send socket write (net.write_some) and Unix peer credentials
# (unix.peer_credentials) that warren's server is built on.
# tools/fetch-toolchain.py stages the std at this pin in place of the bundled
# tree, never over it.

